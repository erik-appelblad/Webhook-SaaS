services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
      POSTGRES_DB: saas
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d saas"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0 --ui-port 8080
    ports:
      - "7233:7233"
      - "8080:8080"

  sink:
    profiles: ["sink"]
    build:
      context: .
      dockerfile: Dockerfile.sink
    environment:
      SINK_ADDRESS: ":9099"
    ports:
      - "9099:9099"

volumes:
  postgres-data:
