<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Webhook Chaos Sink</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1e232d;
      --border: #2a3140;
      --text: #e6eaf2;
      --muted: #8b95a7;
      --accent: #6aa6ff;
      --ok: #3ad29f;
      --warn: #f5b942;
      --err: #ff6b6b;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 20px 48px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 650;
    }
    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .url-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
    }
    .url-box code {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 600;
    }
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    button {
      font: inherit;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary {
      background: var(--accent);
      color: #0b1019;
      border-color: var(--accent);
      font-weight: 600;
    }
    button.danger { color: var(--err); }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .full { grid-column: 1 / -1; }
    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: var(--muted);
    }
    input, select, textarea {
      font: inherit;
      font-size: 13px;
      padding: 7px 9px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-family: var(--mono);
      font-weight: 600;
      border: 1px solid transparent;
    }
    .badge-ok { color: var(--ok); background: rgba(58, 210, 159, 0.12); border-color: rgba(58, 210, 159, 0.35); }
    .badge-warn { color: var(--warn); background: rgba(245, 185, 66, 0.12); border-color: rgba(245, 185, 66, 0.35); }
    .badge-err { color: var(--err); background: rgba(255, 107, 107, 0.12); border-color: rgba(255, 107, 107, 0.35); }
    .badge-rule { color: var(--muted); background: var(--panel-2); border-color: var(--border); }
    .request-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .req {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }
    .req-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .req-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 12px;
    }
    .req-time {
      color: var(--muted);
      font-size: 12px;
      font-family: var(--mono);
    }
    pre {
      margin: 6px 0 0;
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow-x: auto;
      font-family: var(--mono);
      font-size: 12px;
    }
    details {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    details summary { cursor: pointer; }
    .empty {
      text-align: center;
      padding: 36px 16px;
      color: var(--muted);
      font-size: 14px;
      border: 1px dashed var(--border);
      border-radius: 8px;
    }
    .status-line {
      min-height: 18px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--ok);
    }
    .status-line.err { color: var(--err); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Webhook Chaos Sink</h1>
        <p class="subtitle">Local receiver for testing deliveries, Temporal retries, latency, and HMAC signatures.</p>
      </div>
      <div class="url-box">
        <code id="webhookUrl"></code>
        <button id="copyBtn" type="button">Copy</button>
      </div>
    </header>

    <div class="grid">
      <section class="card">
        <h2>Chaos Rules</h2>
        <div class="presets">
          <button type="button" data-preset="ok">Always 200 OK</button>
          <button type="button" data-preset="fail2">Fail first 2 (503)</button>
          <button type="button" data-preset="ratelimit">429 + Retry-After: 5</button>
          <button type="button" data-preset="badreq">Permanent 400</button>
          <button type="button" data-preset="slow">Slow 3s (200)</button>
          <button type="button" data-preset="flaky">Flaky 50% (503)</button>
        </div>

        <form id="configForm">
          <div class="form-grid">
            <label>
              Mode
              <select id="mode" name="mode">
                <option value="ok">ok</option>
                <option value="fail_first_n">fail_first_n</option>
                <option value="status">status</option>
                <option value="flaky">flaky</option>
              </select>
            </label>
            <label>
              Failure HTTP Status
              <input id="statusCode" name="status_code" type="number" min="100" max="599" />
            </label>
            <label>
              Fail Count (remaining)
              <input id="failCount" name="fail_count" type="number" min="0" />
            </label>
            <label>
              Failure Rate (0..1)
              <input id="failureRate" name="failure_rate" type="number" min="0" max="1" step="0.05" />
            </label>
            <label>
              Delay (ms)
              <input id="delayMs" name="delay_ms" type="number" min="0" max="30000" />
            </label>
            <label>
              Retry-After Header
              <input id="retryAfter" name="retry_after" type="text" placeholder="e.g. 5" />
            </label>
            <label class="full">
              Signing Secret (optional HMAC-SHA256)
              <input id="signingSecret" name="signing_secret" type="text" placeholder="verifies X-Webhook-Signature" />
            </label>
            <label class="full">
              Custom Response Body (optional)
              <textarea id="responseBody" name="response_body" rows="2" placeholder="defaults to JSON summary"></textarea>
            </label>
          </div>
          <div class="actions">
            <button class="primary" type="submit">Save Rules</button>
            <button id="resetBtn" class="danger" type="button">Reset All</button>
          </div>
          <div id="statusMsg" class="status-line"></div>
        </form>
      </section>

      <section class="card">
        <div class="toolbar">
          <h2 style="margin:0;">Captured Requests (<span id="reqCount">0</span>)</h2>
          <div class="toolbar-right">
            <button id="pauseBtn" type="button">Pause Auto-Refresh</button>
            <button id="clearBtn" type="button">Clear</button>
          </div>
        </div>
        <div id="requests" class="request-list">
          <div class="empty">Waiting for webhook POST requests…</div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const webhookUrlEl = document.getElementById('webhookUrl');
    const copyBtn = document.getElementById('copyBtn');
    const form = document.getElementById('configForm');
    const statusMsg = document.getElementById('statusMsg');
    const requestsEl = document.getElementById('requests');
    const reqCountEl = document.getElementById('reqCount');
    const pauseBtn = document.getElementById('pauseBtn');
    const clearBtn = document.getElementById('clearBtn');
    const resetBtn = document.getElementById('resetBtn');

    webhookUrlEl.textContent = `${window.location.origin}/webhook`;

    let paused = false;
    let formDirty = false;

    const presets = {
      ok: { mode: 'ok', status_code: 503, fail_count: 0, failure_rate: 0, delay_ms: 0, retry_after: '' },
      fail2: { mode: 'fail_first_n', status_code: 503, fail_count: 2, failure_rate: 0, delay_ms: 0, retry_after: '' },
      ratelimit: { mode: 'status', status_code: 429, fail_count: 0, failure_rate: 0, delay_ms: 0, retry_after: '5' },
      badreq: { mode: 'status', status_code: 400, fail_count: 0, failure_rate: 0, delay_ms: 0, retry_after: '' },
      slow: { mode: 'ok', status_code: 503, fail_count: 0, failure_rate: 0, delay_ms: 3000, retry_after: '' },
      flaky: { mode: 'flaky', status_code: 503, fail_count: 0, failure_rate: 0.5, delay_ms: 0, retry_after: '' },
    };

    function setNotice(text, isErr = false) {
      statusMsg.textContent = text;
      statusMsg.className = isErr ? 'status-line err' : 'status-line';
    }

    function applyConfigToForm(cfg) {
      document.getElementById('mode').value = cfg.mode || 'ok';
      document.getElementById('statusCode').value = cfg.status_code ?? 503;
      document.getElementById('failCount').value = cfg.fail_count ?? 0;
      document.getElementById('failureRate').value = cfg.failure_rate ?? 0;
      document.getElementById('delayMs').value = cfg.delay_ms ?? 0;
      document.getElementById('retryAfter').value = cfg.retry_after || '';
      document.getElementById('signingSecret').value = cfg.signing_secret || '';
      document.getElementById('responseBody').value = cfg.response_body || '';
    }

    function readConfigFromForm() {
      return {
        mode: document.getElementById('mode').value,
        status_code: Number(document.getElementById('statusCode').value) || 503,
        fail_count: Number(document.getElementById('failCount').value) || 0,
        failure_rate: Number(document.getElementById('failureRate').value) || 0,
        delay_ms: Number(document.getElementById('delayMs').value) || 0,
        retry_after: document.getElementById('retryAfter').value,
        signing_secret: document.getElementById('signingSecret').value,
        response_body: document.getElementById('responseBody').value,
      };
    }

    async function saveConfig(cfg) {
      try {
        const res = await fetch('/api/config', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(cfg),
        });
        if (!res.ok) {
          throw new Error(await res.text());
        }
        const saved = await res.json();
        formDirty = false;
        applyConfigToForm(saved);
        setNotice(`Saved (${saved.mode})`);
      } catch (err) {
        setNotice(err.message || 'Failed to save config', true);
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function prettyBody(body) {
      if (!body) return '(empty)';
      try {
        return JSON.stringify(JSON.parse(body), null, 2);
      } catch {
        return body;
      }
    }

    function statusClass(status) {
      if (status >= 200 && status < 300) return 'badge-ok';
      if (status >= 400 && status < 500) return 'badge-warn';
      return 'badge-err';
    }

    function renderRequests(items) {
      reqCountEl.textContent = String(items.length);
      if (items.length === 0) {
        requestsEl.innerHTML = '<div class="empty">Waiting for webhook POST requests…</div>';
        return;
      }

      requestsEl.innerHTML = items.map((item) => {
        const sigBadge = item.signature_valid === true
          ? '<span class="badge badge-ok">sig valid</span>'
          : item.signature_valid === false
            ? '<span class="badge badge-err">sig invalid</span>'
            : '';
        const delayTag = item.delay_ms > 0 ? `<span class="badge badge-rule">${item.delay_ms}ms</span>` : '';
        return `
          <article class="req">
            <div class="req-head">
              <div class="req-meta">
                <span class="badge ${statusClass(item.response_status)}">${item.response_status}</span>
                <span>${escapeHtml(item.method)} ${escapeHtml(item.path)}</span>
                <span class="badge badge-rule">${escapeHtml(item.chaos_rule)}</span>
                ${delayTag}
                ${sigBadge}
              </div>
              <span class="req-time">${new Date(item.received_at).toLocaleTimeString()}</span>
            </div>
            <pre>${escapeHtml(prettyBody(item.body))}</pre>
            <details>
              <summary>Headers (${Object.keys(item.headers || {}).length})</summary>
              <pre>${escapeHtml(JSON.stringify(item.headers || {}, null, 2))}</pre>
            </details>
          </article>
        `;
      }).join('');
    }

    async function poll(forceFormSync = false) {
      try {
        const res = await fetch('/api/requests');
        if (!res.ok) return;
        const data = await res.json();
        if (forceFormSync || !formDirty) {
          applyConfigToForm(data.config);
        }
        renderRequests(data.requests || []);
      } catch {
        // Ignore transient poll errors.
      }
    }

    form.addEventListener('input', () => { formDirty = true; });
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      void saveConfig(readConfigFromForm());
    });

    document.querySelectorAll('[data-preset]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const preset = presets[btn.getAttribute('data-preset')];
        if (!preset) return;
        const merged = {
          ...readConfigFromForm(),
          ...preset,
        };
        void saveConfig(merged);
      });
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(webhookUrlEl.textContent);
        copyBtn.textContent = 'Copied';
        setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1200);
      } catch {
        setNotice('Clipboard unavailable', true);
      }
    });

    pauseBtn.addEventListener('click', () => {
      paused = !paused;
      pauseBtn.textContent = paused ? 'Resume Auto-Refresh' : 'Pause Auto-Refresh';
    });

    clearBtn.addEventListener('click', async () => {
      await fetch('/api/requests', { method: 'DELETE' });
      void poll();
    });

    resetBtn.addEventListener('click', async () => {
      const res = await fetch('/api/reset', { method: 'POST' });
      if (res.ok) {
        const data = await res.json();
        formDirty = false;
        applyConfigToForm(data.config);
        renderRequests(data.requests || []);
        setNotice('Reset to defaults');
      }
    });

    void poll(true);
    setInterval(() => {
      if (!paused) void poll();
    }, 2000);
  </script>
</body>
</html>
